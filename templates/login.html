<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giriş · Sunucu Paneli</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="login-page" data-theme="dark"><main class="login-card"><div class="brand-mark">U</div><p class="eyebrow">USER RTM SERVERS</p><h1>Giriş yap</h1><p class="muted">VPN yönetici paneli</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="post" action="/login"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Kullanıcı adı<input name="username" autocomplete="username" required maxlength="32"></label><label>Şifre<input type="password" name="password" autocomplete="current-password" required></label><button class="button primary full" type="submit">Giriş yap</button></form><p class="muted login-help">Panel giriş bilgisi AnyConnect müşteri kullanıcı adı/şifresinden ayrıdır.</p></main></body></html>
